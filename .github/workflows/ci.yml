name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: |
          bun run --cwd apps/cli tsc --noEmit
          bun run --cwd packages/core tsc --noEmit 2>/dev/null || true
          bun run --cwd packages/agents tsc --noEmit 2>/dev/null || true

      - name: Run unit tests
        run: bun test --bail

      - name: Smoke canary (task-00)
        run: bun test packages/evals/evals.test.ts --test-name-pattern "task-00-smoke"
