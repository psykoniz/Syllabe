# Trigger a ProjectOS agent build from a GitHub issue or manually.
#
# Usage:
#  - Manual: Actions → "ProjectOS Agent Build" → Run workflow → enter the task
#  - Issue:  open an issue with the `agent-build` label; the issue title+body
#            become the task description
#
# Required repository secrets:
#  - ANTHROPIC_AUTH_TOKEN  (or ANTHROPIC_API_KEY)
#  - ANTHROPIC_BASE_URL    (optional, for proxies)
name: ProjectOS Agent Build

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task for the agent to build"
        required: true
        type: string
      model:
        description: "Model override (empty = role-based routing)"
        required: false
        type: string
        default: "claude-sonnet-4-6"
  issues:
    types: [labeled]

jobs:
  agent-build:
    # Manual dispatch always runs; issue trigger only with the agent-build label
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'agent-build'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve task
        id: task
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          DISPATCH_TASK: ${{ inputs.task }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TASK="$DISPATCH_TASK"
          else
            TASK="$ISSUE_TITLE — $ISSUE_BODY"
          fi
          # Multi-line safe output
          {
            echo "task<<PROJECTOS_EOF"
            echo "$TASK"
            echo "PROJECTOS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run agent build
        env:
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        run: |
          mkdir -p /tmp/agent-workspace && cd /tmp/agent-workspace && git init -q
          bun "$GITHUB_WORKSPACE/apps/cli/index.ts" build \
            --task "${{ steps.task.outputs.task }}" \
            --workspace /tmp/agent-workspace \
            --db /tmp/agent-workspace/.projectos/runs.db \
            --traces /tmp/agent-workspace/.projectos/traces.jsonl \
            --model-override "${{ inputs.model || 'claude-sonnet-4-6' }}" \
            --yes

      - name: Publish result branch
        if: success()
        run: |
          cd /tmp/agent-workspace
          BRANCH="agent-build/${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add -A
          git -c user.name="projectos-agent" -c user.email="agent@projectos" \
            commit -m "Agent build: ${{ steps.task.outputs.task }}" || echo "nothing to commit"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -u origin "$BRANCH" || echo "push skipped"

      - name: Comment on issue
        if: github.event_name == 'issues' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const outcome = "${{ job.status }}";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `ProjectOS agent build ${outcome === 'success' ? 'succeeded ✅' : 'failed ❌'} — see [run logs](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}). Result branch: \`agent-build/${context.runId}\``
            });
